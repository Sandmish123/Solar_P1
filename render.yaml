databases:
  - name: solar-report-db
    plan: free

services:
  - type: web
    name: solar-report-app
    env: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: solar-report-db
          property: connectionString
